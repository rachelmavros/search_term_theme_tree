<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#f4f6f9;color:#1f2933}header{background:#1a73e8;color:#fff;padding:18px 26px}header h1{margin:0;font-size:20px}header p{margin:4px 0 0;font-size:13px;opacity:.9}.wrap{padding:22px 26px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:10px;padding:18px;margin-bottom:20px}.controls{display:flex;flex-wrap:wrap;gap:18px 22px;align-items:flex-end}.controls>label,.maprow label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:4px}input[type=file]{font-size:14px}input[type=range]{width:150px}input[type=text],select{font-size:13px;padding:6px 8px;border:1px solid #d0d8e2;border-radius:6px;min-width:170px}.val{color:#1a73e8}#status{font-size:13px;color:#52606d;margin-top:10px}#chart{width:100%;overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;margin-top:6px}th,td{border:1px solid #e3e8ef;padding:7px 9px;text-align:left;vertical-align:top}th{background:#f0f4f9}td.num{text-align:right}.node circle{stroke:#fff;stroke-width:2px}.node text{font-size:12px;fill:#1f2933}.link{fill:none;stroke:#c4ccd6;stroke-width:1.5px}.hint{font-size:12px;color:#7b8794}button{background:#1a73e8;color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600}button.secondary{background:#eef2f7;color:#1f2933;border:1px solid #d0d8e2;font-weight:400}button:disabled{opacity:.45;cursor:not-allowed}.maprow{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;margin-top:4px}.ms{position:relative}.ms-btn{background:#fff;color:#1f2933;border:1px solid #d0d8e2;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:400;cursor:pointer;min-width:240px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}.ms-btn .caret{color:#7b8794}.ms-panel{display:none;position:absolute;z-index:50;top:calc(100% + 4px);left:0;background:#fff;border:1px solid #d0d8e2;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);width:450px;max-height:340px;overflow:auto;padding:8px}.ms-panel.open{display:block}.ms-actions{display:flex;gap:14px;padding:4px 8px 8px;border-bottom:1px solid #eef2f7;margin-bottom:6px}.ms-actions a{color:#1a73e8;font-size:12px;cursor:pointer;text-decoration:none;font-weight:600}.ms-item{display:flex;flex-direction:row;align-items:center;gap:8px;padding:5px 8px;font-size:13px;font-weight:400;border-radius:5px;cursor:pointer}.ms-item:hover{background:#f4f6f9}.ms-item input{margin:0;flex:0 0 auto;width:16px;height:16px}.ms-item span{flex:1 1 auto;white-space:normal;word-break:break-word}#settingsCard{background:#f7faff;border:1px solid #d6e4fb}#settingsCard h3{margin:0 0 8px;font-size:14px;color:#1a4fa0}#settingsBody{font-size:13px;line-height:1.7;color:#33404f}#settingsBody .chip{display:inline-block;background:#fff;border:1px solid #d6e4fb;border-radius:20px;padding:2px 10px;margin:2px 4px 2px 0}

<body>
<header><h1>Search Term Theme Tree</h1><p>Upload a Google Ads search term report (.xlsx / .csv). It auto-finds theme groupings, their spend, and top terms.</p></header>
<div class="wrap">
<div class="card"><div class="controls">
<label>Upload report<input type="file" id="file" accept=".xlsx,.xls,.csv"></label>
<label># of themes: <span class="val" id="kVal">6</span><input type="range" id="k" min="3" max="12" value="6"></label>
<label>Top terms per theme: <span class="val" id="tVal">5</span><input type="range" id="t" min="2" max="50" value="5"></label>
<label id="campWrap" style="display:none;">Campaigns to analyze<div class="ms"><button type="button" class="ms-btn" id="msBtn"><span id="msLabel">All campaigns</span><span class="caret">&#9662;</span></button><div class="ms-panel" id="msPanel"><div class="ms-actions"><a id="msAll">Select all</a><a id="msNone">Clear all</a></div><div id="msList"></div></div></div></label>
<label>Search term contains<input type="text" id="containsFilter" placeholder="e.g. drink"></label>
<button class="secondary" id="reset">Reset zoom</button><button class="secondary" id="downloadPng" disabled>Download PNG</button><button class="secondary" id="downloadPdf" disabled>Download PDF</button><button class="secondary" id="downloadXlsx" disabled>Download Excel</button>
</div><div id="status">Waiting for a file...</div></div>
<div class="card" id="mapCard" style="display:none;"><h3 style="margin-top:0;">Map your columns</h3><p class="hint" style="margin-top:0;">We guessed these for you. Change any dropdown if it looks wrong, then click Build tree.</p><div class="maprow">
<label>Search term column<select id="mapTerm"></select></label><label>Cost / Spend column<select id="mapCost"></select></label><label>Campaign column (optional)<select id="mapCamp"></select></label><label>Sort top terms by<select id="mapSort"></select></label><label>Secondary KPI (optional)<select id="mapKpi"></select></label><button id="buildBtn">Build tree</button>
</div></div>
<div id="reportArea"><div class="card"><div id="chart"></div></div><div class="card" id="tableCard" style="display:none;"><h3 style="margin-top:0;">Theme summary</h3><div id="summary"></div></div><div class="card" id="settingsCard" style="display:none;"><h3>Report settings</h3><div id="settingsBody"></div></div></div>
</div>
<script>
const STOP=new Set(("the a an to of and or for in on with near me best top buy online cheap price cost costs how what is are my your our you it that this get vs where when why can do does free shop store review reviews deal deals sale near www com http https amazon google").split(" "));
let allTerms=[],rawTerms=[],sheetRows=[],headerIdx=-1,headerCells=[],costColIdx=-1,sortColIdx=-1,campColIdx=-1,kpiColIdx=-1,sortColName="Cost",kpiColName="",campaignNames=[],selectedCampaigns=new Set(),latestThemes=[],latestTotal=0;
const fmt$=v=>"$"+(+v||0).toLocaleString(undefined,{maximumFractionDigits:2,minimumFractionDigits:2});const fmtNum=v=>(+v||0).toLocaleString(undefined,{maximumFractionDigits:2});
file.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array'}),sh=wb.Sheets[wb.SheetNames[0]];sheetRows=XLSX.utils.sheet_to_json(sh,{header:1,raw:false,defval:""});detect();}catch(err){setStatus("Couldn't read that file: "+err.message)}};r.readAsArrayBuffer(f)};
buildBtn.onclick=applyMapping;['k','t'].forEach(id=>document.getElementById(id).oninput=e=>{document.getElementById(id+'Val').textContent=e.target.value;if(allTerms.length)filterAndBuild()});mapSort.onchange=()=>{if(allTerms.length){sortColIdx=+mapSort.value;sortColName=headerCells[sortColIdx]||"Cost";filterAndBuild()}};mapKpi.onchange=()=>{if(allTerms.length){kpiColIdx=+mapKpi.value;kpiColName=kpiColIdx>-1?(headerCells[kpiColIdx]||""):"";filterAndBuild()}};containsFilter.oninput=debounce(()=>{if(allTerms.length)filterAndBuild()},250);reset.onclick=()=>{if(rawTerms.length)build()};downloadPng.onclick=downloadReportPNG;downloadPdf.onclick=downloadReportPDF;downloadXlsx.onclick=downloadXLSX;
msBtn.onclick=e=>{e.stopPropagation();msPanel.classList.toggle('open')};document.onclick=e=>{if(msPanel.classList.contains('open')&&!e.target.closest('.ms'))msPanel.classList.remove('open')};msAll.onclick=()=>{campaignNames.forEach(c=>selectedCampaigns.add(c));syncChecks();filterAndBuild()};msNone.onclick=()=>{selectedCampaigns.clear();syncChecks();filterAndBuild()};
function detect(){headerIdx=sheetRows.findIndex(r=>r.some(c=>String(c).toLowerCase().includes('search term')));if(headerIdx<0)headerIdx=sheetRows.findIndex(r=>r.filter(c=>String(c).trim()).length>=2);if(headerIdx<0)return setStatus("Couldn't find a header row.");headerCells=sheetRows[headerIdx].map(c=>String(c).trim());const low=headerCells.map(h=>h.toLowerCase());fillSelect('mapTerm',low.findIndex(h=>h.includes('search term')),false);fillSelect('mapCost',low.findIndex(h=>h.includes('cost')||h.includes('spend')||h.includes('amount')),false);fillSelect('mapCamp',low.findIndex(h=>h.includes('campaign')),true);fillSelect('mapSort',Math.max(0,low.findIndex(h=>h.includes('cost')||h.includes('spend')||h.includes('amount'))),false);fillSelect('mapKpi',-1,true);mapCard.style.display='block';setStatus('Found '+(sheetRows.length-headerIdx-1)+' rows. Confirm the column mapping below, then click Build tree.')}
function fillSelect(id,guess,none){const s=document.getElementById(id);s.innerHTML='';if(none)s.append(new Option('(none)','-1'));headerCells.forEach((h,i)=>s.append(new Option(h||('Column '+(i+1)),String(i))));if(guess>-1)s.value=String(guess);else if(!none)s.value='0'}
function applyMapping(){const termCol=+mapTerm.value;costColIdx=+mapCost.value;campColIdx=+mapCamp.value;sortColIdx=+mapSort.value;kpiColIdx=+mapKpi.value;sortColName=headerCells[sortColIdx]||'Cost';kpiColName=kpiColIdx>-1?(headerCells[kpiColIdx]||''):'';allTerms=[];for(let i=headerIdx+1;i<sheetRows.length;i++){const term=String(sheetRows[i][termCol]||'').trim();if(!term || term.toLowerCase().startsWith('total'))continue;const metrics={},displays={};for(let c=0;c<headerCells.length;c++){metrics[c]=parseNum(sheetRows[i][c]);displays[c]=String(sheetRows[i][c]??'').trim()}allTerms.push({term,cost:parseNum(sheetRows[i][costColIdx]),campaign:campColIdx>-1?String(sheetRows[i][campColIdx]||'').trim():'',metrics,displays})}if(!allTerms.length)return setStatus('No data rows found.');buildCampaigns();filterAndBuild()}
function buildCampaigns(){if(campColIdx<0){campWrap.style.display='none';campaignNames=[];selectedCampaigns=new Set();return}campaignNames=[...new Set(allTerms.map(r=>r.campaign).filter(Boolean))].sort((a,b)=>a.localeCompare(b));if(!campaignNames.length){campWrap.style.display='none';return}selectedCampaigns=new Set(campaignNames);msList.innerHTML='';campaignNames.forEach(c=>{const row=document.createElement('label');row.className='ms-item';const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.value=c;cb.onchange=()=>{cb.checked?selectedCampaigns.add(c):selectedCampaigns.delete(c);filterAndBuild()};const sp=document.createElement('span');sp.textContent=c;row.append(cb,sp);msList.append(row)});campWrap.style.display='flex';updateMsLabel()}
function syncChecks(){document.querySelectorAll('#msList input').forEach(cb=>cb.checked=selectedCampaigns.has(cb.value))}function updateMsLabel(){const n=selectedCampaigns.size,t=campaignNames.length;msLabel.textContent=n===t?'All campaigns ('+t+')':n===0?'None selected':n+' of '+t+' selected'}
function filterAndBuild(){updateMsLabel();const contains=containsFilter.value.trim().toLowerCase();if(campColIdx>-1&&selectedCampaigns.size===0)return clearOutput('Select at least one campaign to analyze.');rawTerms=allTerms.filter(r=>(campColIdx<0||selectedCampaigns.has(r.campaign))&&(!contains||r.term.toLowerCase().includes(contains)));if(!rawTerms.length)return clearOutput('No search terms match the current filters.');const total=rawTerms.reduce((s,r)=>s+r.cost,0);setStatus('Loaded '+rawTerms.length+' search terms - total spend '+fmt$(total));build()}
function clearOutput(msg){chart.innerHTML='';tableCard.style.display='none';settingsCard.style.display='none';latestThemes=[];latestTotal=0;toggleDownloads(false);setStatus(msg)}
function parseNum(v){const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n}function sortVal(r){return r.metrics?.[sortColIdx]||0}function sortIsCost(){return sortColIdx===costColIdx}function sortDisplay(r){return (!sortIsCost()&&r.displays?.[sortColIdx])?r.displays[sortColIdx]:fmtNum(sortVal(r))}function hasKpi(){return kpiColIdx>-1}function kpiDisplay(r){return hasKpi()?(r.displays?.[kpiColIdx]||fmtNum(r.metrics?.[kpiColIdx]||0)):''}function debounce(fn,d){let t;return()=>{clearTimeout(t);t=setTimeout(fn,d)}}
function build(){const K=+k.value,TOP=+t.value;const toks=rawTerms.map(r=>{const w=r.term.toLowerCase().split(/[^a-z0-9]+/).filter(x=>x&&!STOP.has(x)&&x.length>1);const s=new Set(w);for(let i=0;i<w.length-1;i++)s.add(w[i]+' '+w[i+1]);return s});const assigned=Array(rawTerms.length).fill(false),themes=[];for(let it=0;it<K;it++){const score={};toks.forEach((set,i)=>{if(assigned[i])return;set.forEach(x=>score[x]=(score[x]||0)+rawTerms[i].cost+.001)});let best=null,bs=-1;for(const x in score)if(score[x]>bs){bs=score[x];best=x}if(!best)break;const mem=[];toks.forEach((set,i)=>{if(!assigned[i]&&set.has(best)){assigned[i]=true;mem.push(i)}});if(mem.length)themes.push({name:best,members:mem})}const left=[];assigned.forEach((a,i)=>{if(!a)left.push(i)});if(left.length)themes.push({name:'other / ungrouped',members:left});themes.forEach(th=>{th.spend=th.members.reduce((s,i)=>s+rawTerms[i].cost,0);th.count=th.members.length;th.top=th.members.map(i=>rawTerms[i]).sort((a,b)=>sortVal(b)-sortVal(a)).slice(0,TOP)});themes.sort((a,b)=>b.spend-a.spend);latestThemes=themes;latestTotal=rawTerms.reduce((s,r)=>s+r.cost,0);settings();drawTree(themes,latestTotal);drawSummary(themes,latestTotal);toggleDownloads(true)}
function settings(){const parts=[];parts.push('<strong>Campaigns:</strong> '+(campColIdx>-1?(selectedCampaigns.size===campaignNames.length?'All ('+campaignNames.length+')':[...selectedCampaigns].sort().map(c=>'<span class="chip">'+esc(c)+'</span>').join('')):'no campaign column mapped'));parts.push('<strong>Search term contains:</strong> '+(containsFilter.value?'<span class="chip">"'+esc(containsFilter.value)+'"</span>':'(none)'));parts.push('<strong>Themes:</strong> '+k.value);parts.push('<strong>Top terms/theme:</strong> '+t.value);parts.push('<strong>Sort by:</strong> '+(sortIsCost()?'Cost':esc(sortColName)));if(hasKpi())parts.push('<strong>Secondary KPI:</strong> '+esc(kpiColName));parts.push('<strong>Search terms analyzed:</strong> '+rawTerms.length);parts.push('<strong>Total spend:</strong> '+fmt$(latestTotal));settingsCard.style.display='block';settingsBody.innerHTML=parts.join(' &middot; ')}
function drawTree(themes,total){const root={name:'Total',spend:total,children:themes.map(th=>({name:th.name,spend:th.spend,pct:total?th.spend/total:0,children:th.top.map(tm=>({name:tm.term,spend:tm.cost,sortDisp:sortDisplay(tm),kpiDisp:kpiDisplay(tm)}))}))};chart.innerHTML='';const height=Math.max(500,(themes.length*((d3.max(themes,d=>d.top.length)||1)+1))*24),width=1150,margin={top:20,right:430,bottom:20,left:120};const svg=d3.select('#chart').append('svg').attr('width',width).attr('height',height).attr('xmlns','http://www.w3.org/2000/svg'),g=svg.append('g').attr('transform','translate('+margin.left+','+margin.top+')');const zoom=d3.zoom().scaleExtent([.3,3]).on('zoom',e=>g.attr('transform',e.transform));svg.call(zoom).call(zoom.transform,d3.zoomIdentity.translate(margin.left,margin.top));const h=d3.hierarchy(root);d3.tree().size([height-margin.top-margin.bottom,width-margin.left-margin.right])(h);const r=d3.scaleSqrt().domain([0,d3.max(h.descendants(),d=>d.data.spend)||1]).range([4,26]),color=d3.scaleOrdinal(d3.schemeTableau10);g.selectAll('.link').data(h.links()).enter().append('path').attr('class','link').attr('d',d3.linkHorizontal().x(d=>d.y).y(d=>d.x));const node=g.selectAll('.node').data(h.descendants()).enter().append('g').attr('class','node').attr('transform',d=>'translate('+d.y+','+d.x+')');node.append('circle').attr('r',d=>r(d.data.spend)).attr('fill',d=>d.depth===0?'#1a73e8':color(h.children.indexOf(d.depth===1?d:d.parent)));node.append('text').attr('dy','.32em').attr('x',d=>d.children?-(r(d.data.spend)+6):(r(d.data.spend)+6)).attr('text-anchor',d=>d.children?'end':'start').text(d=>{const lab=d.data.name.length>34?d.data.name.slice(0,34)+'...':d.data.name;if(d.depth===1)return lab+' - '+fmt$(d.data.spend)+' ('+(d.data.pct*100).toFixed(0)+'%)';if(d.depth===2){const m=sortIsCost()?fmt$(d.data.spend):(sortColName+': '+d.data.sortDisp);const kp=d.data.kpiDisp?' | '+kpiColName+': '+d.data.kpiDisp:'';return lab+' - '+m+kp}return lab+' - '+fmt$(d.data.spend)}).style('font-weight',d=>d.depth<=1?600:400)}
function drawSummary(themes,total){tableCard.style.display='block';const sortLabel=sortIsCost()?'Top terms (by cost)':'Top terms (by '+sortColName+')';let html='<table><thead><tr><th>Theme</th><th>Spend</th><th>% of total</th><th># terms</th><th>'+esc(sortLabel)+'</th></tr></thead><tbody>';themes.forEach(th=>{const tops=th.top.map(x=>esc(x.term)+' ('+(sortIsCost()?fmt$(x.cost):esc(sortDisplay(x)))+')'+(hasKpi()?' | '+esc(kpiColName)+': '+esc(kpiDisplay(x)):'')).join('<br>');html+='<tr><td><strong>'+esc(th.name)+'</strong></td><td class="num">'+fmt$(th.spend)+'</td><td class="num">'+(total?((th.spend/total)*100).toFixed(1):0)+'%</td><td class="num">'+th.count+'</td><td>'+tops+'</td></tr>'});summary.innerHTML=html+'</tbody></table><p class="hint">Export buttons download the current filtered view.</p>'}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function setStatus(m){status.textContent=m}function toggleDownloads(on){['downloadPng','downloadPdf','downloadXlsx'].forEach(id=>document.getElementById(id).disabled=!on)}
function blobDownload(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}async function capture(){const prev=chart.style.overflow;chart.style.overflow='visible';const c=await html2canvas(reportArea,{backgroundColor:'#ffffff',scale:2,scrollX:0,scrollY:-scrollY,windowWidth:reportArea.scrollWidth+40});chart.style.overflow=prev;return c}async function downloadReportPNG(){const c=await capture();c.toBlob(b=>blobDownload(b,'search_term_theme_report.png'))}async function downloadReportPDF(){const c=await capture(),img=c.toDataURL('image/png'),{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:c.width>=c.height?'landscape':'portrait',unit:'pt',format:'a4'}),w=pdf.internal.pageSize.getWidth(),h=pdf.internal.pageSize.getHeight(),ih=c.height*(w/c.width);let left=ih,pos=0;pdf.addImage(img,'PNG',0,pos,w,ih);left-=h;while(left>0){pos-=h;pdf.addPage();pdf.addImage(img,'PNG',0,pos,w,ih);left-=h}pdf.save('search_term_theme_report.pdf')}
async function downloadXLSX(){const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Theme Summary'),thin={style:'thin',color:{argb:'FFE3E8EF'}},border={top:thin,left:thin,bottom:thin,right:thin},fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF0F4F9'}},notCost=!sortIsCost(),withKpi=hasKpi();[['Report settings',''],['Campaigns',campColIdx>-1?(selectedCampaigns.size===campaignNames.length?'All ('+campaignNames.length+')':[...selectedCampaigns].sort().join(', ')):'no campaign column mapped'],['Search term contains',containsFilter.value||'(none)'],['Themes',k.value],['Top terms per theme',t.value],['Sort by',sortIsCost()?'Cost':sortColName],['Secondary KPI',withKpi?kpiColName:'(none)'],['Search terms analyzed',rawTerms.length],['Total spend',latestTotal]].forEach((r,i)=>{const row=ws.addRow(r);row.getCell(1).font={bold:true,color:{argb:'FF1A4FA0'}};if(i===0)row.getCell(1).font={bold:true,size:13,color:{argb:'FF1A4FA0'}};if(r[0]==='Total spend')row.getCell(2).numFmt='$#,##0.00'});ws.addRow([]);const head=['Theme','Theme Spend','% of total','# terms','Search term','Term cost'];if(notCost)head.push(sortColName);if(withKpi)head.push(kpiColName);const hr=ws.addRow(head);hr.eachCell(c=>{c.font={bold:true};c.fill=fill;c.border=border});latestThemes.forEach(th=>{const pct=latestTotal?th.spend/latestTotal:0;th.top.forEach((x,i)=>{const vals=[th.name,i===0?th.spend:null,i===0?pct:null,i===0?th.count:null,x.term,x.cost];if(notCost)vals.push(sortDisplay(x));if(withKpi)vals.push(kpiDisplay(x));const row=ws.addRow(vals);if(i===0){row.getCell(2).numFmt='$#,##0.00';row.getCell(3).numFmt='0.0%'}row.getCell(6).numFmt='$#,##0.00';row.eachCell(c=>c.border=border)})});ws.columns=[{width:26},{width:14},{width:12},{width:10},{width:40},{width:13},{width:16},{width:16}];const buf=await wb.xlsx.writeBuffer();blobDownload(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'search_term_theme_summary.xlsx')}
</script>
</body>
</html>
